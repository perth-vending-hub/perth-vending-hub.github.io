<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Perth Vending Hub | Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <img src="hero.jpeg" alt="Vending Machine Neon" class="hero-image">

    <div class="hero-content">
      <img src="logo.png" alt="Perth Vending Hub Logo" class="logo">
      <div class="coming-soon">🚀 COMING SOON 🚀</div>
    </div>
  </section>

  <!-- Carousel -->
<div class="carousel" aria-label="Image Carousel">
  <button class="carousel-btn prev" aria-label="Previous image">❮</button>

  <div class="carousel-track">
    <img id="carouselImage" class="carousel-image" alt="Carousel image" />
  </div>

  <button class="carousel-btn next" aria-label="Next image">❯</button>
</div>

<div class="carousel-dots" id="carouselDots"></div>

  <!-- PRODUCTS -->
  <section class="products">
    <h2>What We’re Stocking</h2>

    <div class="grid">
      <div class="card">
        <span>🍫</span>
        <h3>Snacks</h3>
      </div>

      <div class="card">
        <span>🥤</span>
        <h3>Drinks</h3>
      </div>

      <div class="card">
        <span>🧼</span>
        <h3>Daily Essentials</h3>
      </div>

      <div class="card">
        <span>🎲</span>
        <h3>Gacha Boxes</h3>
      </div>

      <div class="card">
        <span>🧸</span>
        <h3>Collectible Toys</h3>
      </div>

      <div class="card">
        <span>🍦</span>
        <h3>Ice Creams</h3>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    © 2026 Perth Vending Hub • Neon Vibes • Smart Vending
  </footer>

  <!-- External JS -->
  <script src="script.js"></script>
</body>
</html>
