<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Perth Vending Hub | Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <img src="hero.jpeg" alt="Vending Machine Neon" class="hero-image">

    <div class="hero-content">
      <img src="logo.png" alt="Perth Vending Hub Logo" class="logo">
      <div class="coming-soon">🚀 COMING SOON 🚀</div>
    </div>
  </section>

<!-- PRODUCTS (replaced with 5 carousels) -->
<section class="products">
  <h2>What We’re Stocking</h2>

  <div class="product-carousel-grid" aria-label="Product carousels">

    <!-- Snacks -->
    <div class="carousel-card" data-carousel="snacks">
      <h3 class="carousel-title">🍫 Snacks</h3>

      <div class="carousel single">
        <button class="carousel-btn prev" aria-label="Previous">❮</button>

        <div class="carousel-track">
          <img class="carousel-image" alt="Snacks item" />
        </div>

        <button class="carousel-btn next" aria-label="Next">❯</button>
      </div>

      <div class="carousel-dots"></div>
    </div>

    <!-- Drinks -->
    <div class="carousel-card" data-carousel="drinks">
      <h3 class="carousel-title">🥤 Drinks</h3>

      <div class="carousel single">
        <button class="carousel-btn prev" aria-label="Previous">❮</button>

        <div class="carousel-track">
          <img class="carousel-image" alt="Drinks item" />
        </div>

        <button class="carousel-btn next" aria-label="Next">❯</button>
      </div>

      <div class="carousel-dots"></div>
    </div>

    <!-- Ice Cream -->
    <div class="carousel-card" data-carousel="icecream">
      <h3 class="carousel-title">🍦 Ice Cream</h3>

      <div class="carousel single">
        <button class="carousel-btn prev" aria-label="Previous">❮</button>

        <div class="carousel-track">
          <img class="carousel-image" alt="Ice cream item" />
        </div>

        <button class="carousel-btn next" aria-label="Next">❯</button>
      </div>

      <div class="carousel-dots"></div>
    </div>

    <!-- Gacha -->
    <div class="carousel-card" data-carousel="gacha">
      <h3 class="carousel-title">🎲 Gacha</h3>

      <div class="carousel single">
        <button class="carousel-btn prev" aria-label="Previous">❮</button>

        <div class="carousel-track">
          <img class="carousel-image" alt="Gacha item" />
        </div>

        <button class="carousel-btn next" aria-label="Next">❯</button>
      </div>

      <div class="carousel-dots"></div>
    </div>

    <!-- Daily Essentials -->
    <div class="carousel-card" data-carousel="essentials">
      <h3 class="carousel-title">🧼 Essentials</h3>

      <div class="carousel single">
        <button class="carousel-btn prev" aria-label="Previous">❮</button>

        <div class="carousel-track">
          <img class="carousel-image" alt="Daily essentials item" />
        </div>

        <button class="carousel-btn next" aria-label="Next">❯</button>
      </div>

      <div class="carousel-dots"></div>
    </div>

  </div>
</section>


  <!-- FOOTER -->
  <footer>
    © 2026 Perth Vending Hub • Neon Vibes • Smart Vending
  </footer>

  <!-- External JS -->
  <script src="script.js"></script>
</body>
</html>
