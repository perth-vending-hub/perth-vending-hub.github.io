<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Perth Vending Hub | Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- NAVBAR -->
<header class="navbar">
  <div class="nav-container">
    <div class="nav-logo">Perth Vending Hub</div>

    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="collab.html">Collaborate</a>
      <a href="invest.html">Invest</a>
    </nav>
  </div>
</header>

  <!-- HERO -->
  <section class="hero">
  
    <!-- LEFT SIDE (Girl Image Container) -->
    <div class="hero-left">
      <img src="hero.jpeg" alt="Vending Machine Neon" class="hero-image">
    </div>
  
    <!-- RIGHT SIDE (Content Container) -->
    <div class="hero-right">
      <div class="hero-content">
  
        <!-- PVH LOGO CONTAINER -->
        <div class="logo-container">
          <img src="logo.png" alt="Perth Vending Hub Logo" class="logo-main">
          <img src="name.png" alt="Perth Vending Hub" class="logo-name">
        </div>
  
        <!-- FOLLOW SECTION -->
        <div class="follow-wrapper">
  
          <div class="follow-left">
            <div class="coming-soon">FOLLOW US</div>
          </div>
  
          <div class="follow-right">
            <a class="ig-link" href="https://www.instagram.com/perthvendinghub/" target="_blank" rel="noopener noreferrer"
              aria-label="Visit Perth Vending Hub on Instagram">
              <img src="instagram-logo.png" alt="Instagram Logo" class="ig-logo">
            </a>
          </div>
  
        </div>
  
      </div>
    </div>
  
  </section>

  <!-- PRODUCTS (replaced with 6 carousels) -->
  <section class="products">
    <h2>What We’re Stocking</h2>

    <div class="product-carousel-grid" aria-label="Product carousels">

      <!-- Snacks -->
      <div class="carousel-card" data-carousel="snacks">
        <h3 class="carousel-title">🍫 Snacks</h3>

        <div class="carousel single">
          <div class="carousel-track">
            <img class="carousel-image" alt="Snacks item" />
          </div>
        </div>

        <div class="carousel-dots"></div>
      </div>

      <!-- Drinks -->
      <div class="carousel-card" data-carousel="drinks">
        <h3 class="carousel-title">🥤 Drinks</h3>

        <div class="carousel single">
          <div class="carousel-track">
            <img class="carousel-image" alt="Drinks item" />
          </div>
        </div>

        <div class="carousel-dots"></div>
      </div>

      <!-- Ice Cream -->
      <div class="carousel-card" data-carousel="icecream">
        <h3 class="carousel-title">🍦 Ice Cream</h3>

        <div class="carousel single">
          <div class="carousel-track">
            <img class="carousel-image" alt="Ice cream item" />
          </div>
        </div>

        <div class="carousel-dots"></div>
      </div>

      <!-- Blind Boxes -->
      <div class="carousel-card" data-carousel="blindboxes">
        <h3 class="carousel-title">🎲 Blind Boxes</h3>

        <div class="carousel single">
          <div class="carousel-track">
            <img class="carousel-image" alt="Blind Box item" />
          </div>
        </div>

        <div class="carousel-dots"></div>
      </div>

      <!-- Daily Essentials -->
      <div class="carousel-card" data-carousel="essentials">
        <h3 class="carousel-title">🧼 Essentials</h3>

        <div class="carousel single">
          <div class="carousel-track">
            <img class="carousel-image" alt="Daily essentials item" />
          </div>
        </div>

        <div class="carousel-dots"></div>
      </div>

      <!-- Gacha -->
      <div class="carousel-card" data-carousel="gacha">
        <h3 class="carousel-title">🧸 Gacha</h3>

        <div class="carousel single">
          <div class="carousel-track">
            <img class="carousel-image" alt="Gacha item" />
          </div>
        </div>
        <div class="carousel-dots"></div>
      </div>

    </div>
  </section>


  <!-- FOOTER -->
  <footer>
    © 2026 Perth Vending Hub
  </footer>

  <!-- External JS -->
  <script src="script.js"></script>
</body>

</html>
